services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pis_dev}
      POSTGRES_DB: ${POSTGRES_DB:-pis_titulacion}
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pis}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgres://pis:pis_dev@postgres:5432/pis_titulacion
      DOCS_VOLUME_PATH: /var/data/titulacion-docs
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - docs-prod:/var/data/titulacion-docs

  nginx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    volumes:
      - docs-prod:/var/data/titulacion-docs:ro

volumes:
  pgdata-prod:
  docs-prod:
