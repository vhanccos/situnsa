/* =========================================================

function MVC7_tokenPortal(){
  return String(
    sessionStorage.getItem('token') ||
    localStorage.getItem('token') ||
    ''
  ).trim();
}

function MVC7_cerrarPortalLocal(){
  sessionStorage.clear();
  localStorage.clear();
  window.top.location.href = "<?!= appUrl ?>";
}

function MVC7_validarSesionPortal(){
  const token = MVC7_tokenPortal();
  if(!token){
    MVC7_cerrarPortalLocal();
    return;
  }

  google.script.run
    .withSuccessHandler(function(r){
      if(!r || r.status !== true || r.valida !== true){
        MVC7_cerrarPortalLocal();
        return;
      }

      const sesion = r.sesion || {};
      const rol = String(sesion.rol || '').toLowerCase();
      if(rol !== 'invitado'){
        MVC7_cerrarPortalLocal();
        return;
      }

      ['usuario','dni','nombre','correo','rol','expediente','programa'].forEach(function(k){
        if(sesion[k] !== undefined && sesion[k] !== null){
          sessionStorage.setItem(k, String(sesion[k]));
        }
      });
    })
    .withFailureHandler(MVC7_cerrarPortalLocal)
    .MVC6_validarSesion(token);
}

MVC7_validarSesionPortal();

    localStorage.getItem(nombre)
    ||

}

function cargarTramite(){

  const dni =
    obtenerDatoSesion("dni")
    .toString()
    .trim();


  google.script.run

    .withSuccessHandler(
      function(data){

          data

    .withFailureHandler(

          "ERROR TRÁMITE:",
          error.message
        );

      }
    )

}

function pintarTramite(data){

  ){

    document.getElementById(
      "expediente"
    ).innerHTML =
      "---";


    document.getElementById(
      "estadoGeneral"
    ).innerHTML =

    document.getElementById(
      "etapaActual"

    document.getElementById(

    document.getElementById(

    return;

  document.getElementById(
    "estadoGeneral"

    pintarHistorial([]);

    return;

  google.script.run

    .withSuccessHandler(

          error.message

        pintarHistorial([]);

    .MVC7D_obtenerHistorialAlumno(

/* =====================================
   PINTAR HISTORIAL
===================================== */

function pintarHistorial(data){

  const contenedor =
    document.getElementById(
      "historialAlumno"
    );


  if(!contenedor){
    return;
  }


  if(
    !data ||
    !Array.isArray(data) ||
    data.length == 0
  ){

    contenedor.innerHTML =
      `
        <div class="historial-card">
          No existen movimientos.
        </div>
      `;

    return;

  }


  let html = "";


  data.forEach(
    function(item){

      let color =
        "info";


      if(
        item.estado ==
        "SUCCESS"
      ){

        color =
          "success";

      }


      if(
        item.estado ==
        "WARNING"
      ){

        color =
          "warning";

      }


      if(
        item.estado ==
        "ERROR"
      ){

        color =
          "error";

      }


      html += `

        <div
          class="
            historial-card
            ${color}
          "
        >

          <div class="historial-fecha">

            ${item.fecha || ""}

            <br>

            ${item.hora || ""}

          </div>


          <div class="historial-body">

            <h4>
              ${item.accion || ""}
            </h4>

            <p>
              ${item.descripcion || ""}
            </p>

            <small>

              Etapa:
              ${item.etapa || "-"}

              · Responsable:
              ${item.usuario || "-"}

            </small>

          </div>

        </div>

      `;

    }
  );


  contenedor.innerHTML =
    html;

}

/* =====================================
   PINTAR ETAPAS Y SUBETAPAS
===================================== */

function pintarProcesoAlumno(data){

  const contenedor =
    document.getElementById(
      "procesoAlumno"
    );


  if(!contenedor){
    return;
  }


  if(
    !data ||
    data.length == 0
  ){

    contenedor.innerHTML =
      `
        <div class="historial-card">

          No existe información
          del proceso.

        </div>
      `;

    return;

  }


  let html = "";


  data.forEach(
    function(etapa,index){

      let claseEstado =
        "alumno-no-iniciado";


      if(
        etapa.estado ==
        "EN CURSO"
      ){

        claseEstado =
          "alumno-en-curso";

      }


      if(
        etapa.estado ==
        "FINALIZADO"
      ){

        claseEstado =
          "alumno-finalizado";

      }


      const abrir = true;


      html += `

        <div
          class="
            etapa-alumno-card
            ${claseEstado}
          "
        >

          <div
            class="etapa-alumno-header"
            onclick="
              toggleEtapaAlumno(
                ${index}
              )
            "
          >

            <div>

              <span>
                ETAPA ${etapa.etapa}
              </span>

              <h3>
                ${etapa.nombre}
              </h3>

              <small>
                ${etapa.estado}
              </small>
              <div class="etapa-fechas">
                <span>Inicio: <b>${etapa.fechaInicio || "Pendiente"}</b></span>
                <span>Finalización: <b>${etapa.fechaFin || "Pendiente"}</b></span>
              </div>

            </div>


            <div
              class="etapa-alumno-pct"
            >
              ${etapa.porcentaje || 0}%
            </div>

          </div>


          <div
            class="etapa-alumno-barra"
          >

            <div
              style="
                width:
                ${etapa.porcentaje || 0}%;
              "
            ></div>

          </div>


          <div
            class="etapa-alumno-body"
            id="etapaAlumnoBody${index}"
            style="
              display:
              ${abrir ? "block" : "none"};
            "
          >

      `;


      const procesos =
        etapa.procesos || [];


      procesos.forEach(
        function(p){

          let claseProceso =
            "proceso-no-iniciado";


          let icono =
            "○";


          if(
            p.estado ==
            "EN CURSO"
          ){

            claseProceso =
              "proceso-en-curso";

            icono =
              "◉";

          }


          if(
            p.estado ==
            "FINALIZADO"
          ){

            claseProceso =
              "proceso-finalizado";

            icono =
              "✓";

          }


          const permiteArchivo =
            (
              Number(etapa.etapa) == 1
              &&
              Number(p.subetapa) == 1
            )
            ||
            (
              Number(etapa.etapa) == 2
              &&
              Number(p.subetapa) == 1
            );


          html += `

            <div
              class="
                proceso-alumno-row
                ${claseProceso}
              "
            >

              <div
                class="proceso-alumno-icon"
              >
                ${icono}
              </div>


              <div
                class="proceso-alumno-info"
              >

                <strong>
                  ${p.descripcion || ""}
                </strong>


                <span>
                  Plazo:
                  ${p.plazo || "-"}
                </span>


                <span>
                  Estado:
                  <b>
                    ${p.estado || "NO INICIADO"}
                  </b>
                </span>


                ${
                  p.fechaInicio
                  ? `
                    <small>
                      Inicio:
                      ${p.fechaInicio}
                    </small>
                  `
                  : ''
                }


                ${
                  p.fechaFin
                  ? `
                    <small>
                      Finalización:
                      ${p.fechaFin}
                    </small>
                  `
                  : ''
                }


                ${
                  p.responsable
                  ? `
                    <small>
                      Responsable:
                      ${p.responsable}
                    </small>
                  `
                  : ''
                }

                ${
                  p.checklist && Array.isArray(p.checklist.requisitos)
                  ? `
                    <div class="checklist-invitado">
                      <div class="checklist-invitado-head">
                        <div>
                          <strong>Requisitos de esta subetapa</strong>
                          <small>
                            ${p.checklist.marcados || 0} de ${p.checklist.total || 0} completados
                          </small>
                        </div>
                        <span class="checklist-invitado-pct">
                          ${p.checklist.porcentaje || 0}%
                        </span>
                      </div>

                      <div class="checklist-invitado-barra">
                        <div style="width:${p.checklist.porcentaje || 0}%"></div>
                      </div>

                      <div class="checklist-invitado-items">
                        ${p.checklist.requisitos.map(function(r){
                          return `
                            <div class="checklist-invitado-item ${r.marcado ? 'ok' : 'pendiente'}">
                              <span class="checklist-invitado-check">
                                ${r.marcado ? '✓' : '○'}
                              </span>
                              <div>
                                <b>${r.numero}. ${r.nombre || ''}</b>
                                <small>
                                  ${r.marcado
                                    ? ('Completado' + (r.actualizado ? ' · ' + r.actualizado : ''))
                                    : 'Pendiente'}
                                </small>
                              </div>
                            </div>
                          `;
                        }).join('')}
                      </div>
                    </div>
                  `
                  : ''
                }


                ${
                  p.archivoUrl
                  ? `
                    <div
                      class="archivo-subido-alumno"
                    >

                      <span>
                        Documento presentado:
                      </span>

                      <a
                        href="${p.archivoUrl}"
                        target="_blank"
                      >
                        📄
                        ${p.archivoNombre || "Abrir documento"}
                      </a>

                    </div>
                  `
                  : ''
                }


                ${
                  p.mensaje
                  ? `
                    <div
                      class="mensaje-alumno-subetapa"
                    >
                      💬
                      ${p.mensaje}
                    </div>
                  `
                  : ''
                }


                ${
                  permiteArchivo
                  &&
                  p.estado != "FINALIZADO"
                  ? crearCargaArchivoInvitado(
                      p,
                      etapa
                    )
                  : ''
                }

              </div>

            </div>

          `;

        }
      );


      html += `

          </div>

        </div>

      `;

    }
  );


  contenedor.innerHTML =
    html;

}

/* =====================================
   ESCAPAR TEXTO PARA onclick
===================================== */

function escaparTextoJs(texto){

  return String(
    texto || ""
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  )
  .replace(
    /\r?\n/g,
    " "
  );

}


/* =====================================
   SUBIR ARCHIVO
===================================== */

async function subirArchivoInvitado(
  subetapaId,
  etapa,
  nombreEtapa,
  descripcion,
  correoResponsable
){

  const idInput =
    "archivoSubetapa_" +
    subetapaId;

  const input =
    document.getElementById(
      idInput
    );

  console.log(
    "INPUT ARCHIVO:",
    idInput,
    input
  );

  if(!input){

    alert(
      "No se encontró el control de carga del documento."
    );

    return;

  }

  if(
    !input.files ||
    input.files.length === 0
  ){

    alert(
      "Seleccione un archivo PDF o Word."
    );

    return;

  }

  const archivo =
    input.files[0];

  const extensionValida =
    /\.(pdf|doc|docx)$/i
      .test(
        archivo.name
      );

  if(!extensionValida){

    alert(
      "Solo se permiten archivos PDF, DOC o DOCX."
    );

    return;

  }

  // 20 MB
  const limite =
    20 *
    1024 *
    1024;

  if(
    archivo.size >
    limite
  ){

    alert(
      "El archivo supera el máximo permitido de 20 MB."
    );

    return;

  }

  const boton =
    document.getElementById(
      "btnArchivoSubetapa_" +
      subetapaId
    );

  if(boton){

    boton.disabled =
      true;

    boton.innerHTML =
      "SUBIENDO DOCUMENTO...";

  }

  try{

    const base64 =
      await convertirArchivoBase64(
        archivo
      );

    const dni =
      obtenerDatoSesion(
        "dni"
      );

    const nombreInvitado =
      obtenerDatoSesion(
        "nombre"
      );

    const correoInvitado =
      obtenerDatoSesion(
        "correo"
      );

    const expediente =
      document
        .getElementById(
          "expediente"
        )
        .innerText
        .trim();

    google.script.run

      .withSuccessHandler(
        function(resultado){

          if(boton){

            boton.disabled =
              false;

            boton.innerHTML =
              "SUBIR DOCUMENTO";

          }

          console.log(
            "RESPUESTA SUBIDA:",
            resultado
          );

          if(
            !resultado ||
            resultado.status !== true
          ){

            alert(
              resultado &&
              resultado.message
              ?
              resultado.message
              :
              "No se pudo guardar el documento."
            );

            return;

          }

          alert(
            "DOCUMENTO CARGADO CORRECTAMENTE"
          );

          /*
            ACTUALIZAR LA VISTA
          */

          cargarProcesoCompleto();

        }
      )

      .withFailureHandler(
        function(error){

          if(boton){

            boton.disabled =
              false;

            boton.innerHTML =
              "SUBIR DOCUMENTO";

          }

          console.error(
            "ERROR SUBIDA:",
            error
          );

          alert(
            "ERROR AL SUBIR DOCUMENTO:\n" +
            error.message
          );

        }
      )

      .MVC7D_subirArchivoSubetapa({

        subetapaId:
          subetapaId,

        dni:
          dni,

        expediente:
          expediente,

        nombreInvitado:
          nombreInvitado,

        correoInvitado:
          correoInvitado,

        correoResponsable:
          correoResponsable,

        etapa:
          Number(etapa),

        nombreEtapa:
          nombreEtapa,

        descripcion:
          descripcion,

        nombreArchivo:
          archivo.name,

        mimeType:
          archivo.type ||
          obtenerMimePorNombre(
            archivo.name
          ),

        base64:
          base64

      });

  }
  catch(error){

    if(boton){

      boton.disabled =
        false;

      boton.innerHTML =
        "SUBIR DOCUMENTO";

    }

    console.error(
      error
    );

    alert(
      "No se pudo procesar el documento:\n" +
      error.message
    );

  }

}



function obtenerMimePorNombre(
  nombre
){

  const extension =
    nombre
      .split(".")
      .pop()
      .toLowerCase();

  if(extension === "pdf"){

    return "application/pdf";

  }

  if(extension === "doc"){

    return "application/msword";

  }

  if(extension === "docx"){

    return "application/vnd.openxmlformats-officedocument.wordprocessingml.document";

  }

  return "application/octet-stream";

}

/* =====================================
   CONVERTIR ARCHIVO A BASE64
===================================== */

function convertirArchivoBase64(
  file
){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();

      reader.onload =
        function(){

          const resultado =
            reader.result || "";

          resolve(
            resultado
              .split(",")[1]
          );

        };

      reader.onerror =
        function(){

          reject(
            new Error(
              "No se pudo leer el archivo."
            )
          );

        };

      reader.readAsDataURL(
        file
      );

    }
  );

}

/* =====================================
   CERRAR SESIÓN
===================================== */

function cerrarSesion(e){

  if(e){ e.stopPropagation(); }

  const token = MVC7_tokenPortal();

  const finalizar = function(){
    sessionStorage.clear();
    localStorage.clear();
    window.top.location.href = "<?!= appUrl ?>";
  };

  if(!token){
    finalizar();
    return;
  }

  google.script.run
    .withSuccessHandler(finalizar)
    .withFailureHandler(finalizar)
    .MVC6_cerrarSesion(token);
}


/* =====================================
   MENSAJES INVITADO
===================================== */

function cargarMensajesInvitado(){

  const dni =
    obtenerDatoSesion(
      "dni"
    );


  if(!dni){
    return;
  }


  google.script.run

    .withSuccessHandler(
      function(lista){

        if(
          !lista ||
          lista.length == 0
        ){

          return;

        }


        mostrarAvisoFlotanteAlumno(
          lista[0]
        );

      }
    )

    .withFailureHandler(
      function(error){

        console.log(
          "ERROR MENSAJES:",
          error.message
        );

      }
    )

    .MVC7D_obtenerMensajesInvitado(
      dni
    );

}


/* =====================================
   AVISO FLOTANTE
===================================== */

function mostrarAvisoFlotanteAlumno(
  mensaje
){

  const anterior =
    document.getElementById(
      "avisoTramiteAlumno"
    );


  if(anterior){

    anterior.remove();

  }


  const html = `

    <div
      id="avisoTramiteAlumno"
      class="aviso-tramite-alumno"
    >

      <button
        onclick="
          document
          .getElementById(
            'avisoTramiteAlumno'
          )
          .remove()
        "
      >
        ×
      </button>


      <span>
        ACTUALIZACIÓN DEL TRÁMITE
      </span>


      <strong>

        Etapa
        ${mensaje.etapa || "-"}

        ·

        ${mensaje.nombreEtapa || ""}

      </strong>


      <p>
        ${mensaje.mensaje || ""}
      </p>


      <small>
        ${mensaje.fecha || ""}
      </small>

    </div>

  `;


  document.body
    .insertAdjacentHTML(
      "beforeend",
      html
    );

}
