<script>

/* =========================================================
   LOGIN
   SISTEMA DE TITULACIÓN USE FIPS
   Compatible con Auth.gs consolidado.
========================================================= */

let LOGIN_EN_PROCESO = false;


/* =========================================================
   ENTER
========================================================= */

function loginEnter(event){

  if(
    event &&
    event.key === 'Enter'
  ){
    event.preventDefault();
    login();
  }
}


/* =========================================================
   MENSAJE
========================================================= */

function loginMensaje(texto, tipo){

  const elemento =
    document.getElementById('mensaje');

  if(!elemento){
    return;
  }

  elemento.textContent =
    String(texto || '');

  elemento.dataset.tipo =
    tipo || '';
}


/* =========================================================
   ESTADO DEL BOTÓN
========================================================= */

function loginCargando(activo){

  LOGIN_EN_PROCESO =
    !!activo;

  const boton =
    document.getElementById(
      'btnIngresar'
    );

  if(!boton){
    return;
  }

  boton.disabled =
    LOGIN_EN_PROCESO;

  boton.textContent =
    LOGIN_EN_PROCESO
      ? 'Ingresando...'
      : 'Ingresar';
}


/* =========================================================
   INICIAR SESIÓN
========================================================= */

function login(){

  if(LOGIN_EN_PROCESO){
    return;
  }

  const usuarioInput =
    document.getElementById(
      'usuario'
    );

  const passwordInput =
    document.getElementById(
      'password'
    );

  const usuario =
    usuarioInput
      ? usuarioInput.value.trim()
      : '';

  const password =
    passwordInput
      ? passwordInput.value.trim()
      : '';

  loginMensaje(
    '',
    ''
  );

  if(!usuario){

    loginMensaje(
      'Ingrese su usuario.',
      'error'
    );

    if(usuarioInput){
      usuarioInput.focus();
    }

    return;
  }

  if(!password){

    loginMensaje(
      'Ingrese su contraseña.',
      'error'
    );

    if(passwordInput){
      passwordInput.focus();
    }

    return;
  }

  loginCargando(true);

  google.script.run

    .withSuccessHandler(
      function(response){

        response =
          response || {};

        if(!response.status){

          loginCargando(false);

          loginMensaje(
            response.message ||
            'Usuario o contraseña incorrectos.',
            'error'
          );

          if(passwordInput){
            passwordInput.value = '';
            passwordInput.focus();
          }

          return;
        }

        const datosUsuario = {

          correo:
            response.correo || '',

          usuario:
            response.usuario || '',

          nombre:
            response.nombre || '',

          rol:
            response.rol || '',

          dni:
            response.dni ||
            response.usuario ||
            '',

          expediente:
            response.expediente || '',

          programa:
            response.programa || ''

        };

        /*
          Limpiamos sesiones anteriores para impedir
          que datos de otro usuario permanezcan activos.
        */
        sessionStorage.clear();
        localStorage.clear();

        Object.keys(
          datosUsuario
        ).forEach(
          function(key){

            const valor =
              String(
                datosUsuario[key] || ''
              );

            sessionStorage.setItem(
              key,
              valor
            );

            localStorage.setItem(
              key,
              valor
            );
          }
        );

        /* FASE 7: sesión backend MVC + SOA */
        const tokenSesion = String(response.token || '');
        const permisosSesion = Array.isArray(response.permisos)
          ? response.permisos
          : [];
        const expiraSesion = String(response.sesionExpiraEn || '');

        sessionStorage.setItem('token', tokenSesion);
        sessionStorage.setItem('permisos', JSON.stringify(permisosSesion));
        sessionStorage.setItem('sesionExpiraEn', expiraSesion);

        /* localStorage se conserva temporalmente solo por compatibilidad. */
        localStorage.setItem('token', tokenSesion);
        localStorage.setItem('permisos', JSON.stringify(permisosSesion));
        localStorage.setItem('sesionExpiraEn', expiraSesion);

        const url =
          String(
            response.url || ''
          )
          .trim()
          .replace(
            /^['"]+|['"]+$/g,
            ''
          );

        if(!url){

          loginCargando(false);

          loginMensaje(
            'No se recibió una ruta válida de acceso.',
            'error'
          );

          return;
        }

        /*
          BD-18.8
          No se navega a script.google.com desde el iframe.
          Se evalúa la vista del rol y se sustituye el documento actual,
          conservando sessionStorage/localStorage y evitando X-Frame-Options.
        */
        loginMensaje(
          'Acceso correcto. Cargando su portal...',
          'ok'
        );

        google.script.run
          .withSuccessHandler(function(vista){
            if(!vista || !vista.status || !vista.html){
              loginCargando(false);
              loginMensaje(
                (vista && vista.message) ||
                'No se pudo cargar el portal.',
                'error'
              );
              return;
            }

            try{
              document.open();
              document.write(vista.html);
              document.close();
            }catch(errorVista){
              loginCargando(false);
              loginMensaje(
                'Acceso correcto, pero no se pudo abrir el portal: ' +
                (errorVista.message || errorVista),
                'error'
              );
            }
          })
          .withFailureHandler(function(errorVista){
            loginCargando(false);
            loginMensaje(
              'Acceso correcto, pero no se pudo cargar el portal. ' +
              (errorVista && errorVista.message ? errorVista.message : ''),
              'error'
            );
          })
          .BD188_OBTENER_VISTA_POST_LOGIN(
            response.rol || ''
          );

      }
    )

    .withFailureHandler(
      function(error){

        loginCargando(false);

        loginMensaje(
          'No se pudo iniciar sesión. ' +
          (
            error &&
            error.message
              ? error.message
              : ''
          ),
          'error'
        );

      }
    )

    .BD183_LOGIN(
      usuario,
      password
    );
}


/* =========================================================
   FOCO INICIAL
========================================================= */

document.addEventListener(
  'DOMContentLoaded',
  function(){

    const usuario =
      document.getElementById(
        'usuario'
      );

    if(usuario){
      usuario.focus();
    }

  }
);

</script>
