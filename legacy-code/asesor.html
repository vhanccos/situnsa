function verA(exp,n){e('at').textContent=n+' — '+exp;e('ab').innerHTML='<div class="loadline"><span class="spin"></span>Cargando etapas...</div>';om('ma');google.script.run.withSuccessHandler(function(r){var a=r.avance,h='<div class="tt-alert info"><strong>Etapa actual:</strong> '+x(a.etapaActual)+' - '+x(a.nombreEtapa)+'<br><strong>Subetapa actual:</strong> '+x(a.subetapaActual)+' - '+x(a.descripcionSubetapa)+'<br><strong>Avance:</strong> '+x(a.avance)+'%</div>';a.etapas.forEach(function(q){h+='<div class="tt-stage"><div class="tt-stagehead">ETAPA '+x(q.numero)+' — '+x(q.nombre)+' · '+x(q.avance)+'%</div>';q.subs.forEach(function(s){h+='<div class="tt-substage '+(s.estado==='FINALIZADO'?'fin':'other')+'"><strong>'+x(s.sub)+'. '+x(s.desc)+'</strong><br><small>'+x(s.estado)+' · '+x(s.plazo)+'</small></div>'});h+='</div>'});e('ab').innerHTML=h}).MVC7D_portalAvance(tok,cur.id,exp)}
function reviewDocs(exp,n){e('rvt').textContent=n+' — '+exp;e('rvb').innerHTML='<div class="loadline"><span class="spin"></span>Cargando documentos...</div>';om('mrev');google.script.run.withSuccessHandler(function(r){paintReview(exp,n,r)}).withFailureHandler(function(er){e('rvb').innerHTML='<div class="tt-alert err">'+x(er.message)+'</div>'}).MVC7D_documentosRevisionAsesor(tok,cur.id,exp)}
function paintReview(exp,n,r){if(!r||!r.status){e('rvb').innerHTML='<div class="tt-alert err">'+x((r&&r.message)||'No se pudo cargar')+'</div>';return}var cards=[['Plan de Tesis / Trabajo Académico',1,r.plan],['Borrador de Tesis',2,r.borrador]],h='<div class="review-grid-v29">';cards.forEach(function(c){var d=c[2]||{},ok=!!d.vistoBueno;h+='<div class="review-card-v29 '+(ok?'ok':'')+'"><h4>'+x(c[0])+'</h4>';if(!d.archivoUrl){h+='<div class="review-meta-v29">El alumno todavía no ha cargado un documento.</div>'}else{h+='<span class="rv-badge '+(ok?'ok':'')+'">'+(ok?'✓ VISTO BUENO':'PENDIENTE DE REVISIÓN')+'</span>';h+='<div class="review-meta-v29" style="margin-top:8px"><strong>'+x(d.archivoNombre||'Documento')+'</strong><br>Versión '+x(d.version||1);if(ok)h+='<br>Validado por '+x(d.asesorValido||'')+' · '+x(d.fechaVisto||'');if(d.observacion)h+='<br>Observación: '+x(d.observacion);h+='</div><div class="review-actions-v29"><a class="rv-ver" target="_blank" href="'+x(d.archivoUrl)+'">VER DOCUMENTO</a>';if(!ok)h+='<button class="rv-ok" onclick="window.__rvValidar('+c[1]+',&quot;'+x(exp)+'&quot;)">✓ VISTO BUENO</button>';h+='<button class="rv-reload" onclick="window.__rvRecarga('+c[1]+',&quot;'+x(exp)+'&quot;)">HABILITAR NUEVA CARGA</button><button class="rv-msg" onclick="window.__rvMensaje('+c[1]+',&quot;'+x(exp)+'&quot;)">MENSAJE</button></div>'}h+='</div>'});h+='</div>';e('rvb').innerHTML=h}
window.__rvValidar=function(et,exp){if(!confirm('¿Registrar visto bueno del asesor?'))return;e('rvb').innerHTML='<div class="loadline"><span class="spin"></span>Registrando visto bueno...</div>';google.script.run.withSuccessHandler(function(r){if(!r||!r.status){alert((r&&r.message)||'Error');return}reviewDocs(exp,e('rvt').textContent.split(' — ')[0])}).MVC7D_validarDocumentoAsesor(tok,cur.id,exp,et)};
window.__rvRecarga=function(et,exp){var m=prompt('Observación para el alumno (opcional):','');if(m===null)return;e('rvb').innerHTML='<div class="loadline"><span class="spin"></span>Habilitando nueva carga...</div>';google.script.run.withSuccessHandler(function(r){if(!r||!r.status){alert((r&&r.message)||'Error');return}reviewDocs(exp,e('rvt').textContent.split(' — ')[0])}).MVC7D_habilitarNuevaCargaAsesor(tok,cur.id,exp,et,m)};
window.__rvMensaje=function(et,exp){var m=prompt('Mensaje para el alumno:','');if(m===null||!String(m).trim())return;google.script.run.withSuccessHandler(function(r){alert((r&&r.message)||'Mensaje enviado')}).MVC7D_mensajeAsesorDocumento(tok,cur.id,exp,et,m)};
e('out').onclick=function(){tok='';e('portal').style.display='none';e('login').style.display='block';e('p').value=''};
})();
</script>
