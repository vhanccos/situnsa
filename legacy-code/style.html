<style>
/* =========================================================
   SISTEMA DE TITULACIÓN USE FIPS
   ESTILO INSTITUCIONAL LIMPIO - V10
   Paleta:
   - Grafito / azul oscuro

   - Plomo claro
   - Verde claro SOLO para finalizado

  margin:0;
  padding:0;
}

  --panel:#F7F8F9;

  --texto:#17232C;
  --texto-2:#52616C;
  --texto-3:#74818A;

  --borde:#C5CDD3;
  --borde-fuerte:#AEB8C0;

  --verde:#197648;
  --verde-claro:#E5F2E9;
  --verde-borde:#AFCDBA;

  --plomo:#EEF1F3;
  --plomo-2:#D8DDE1;
  --plomo-3:#89959D;

  --rojo:#A43731;

  --radio:9px;
  --radio-lg:14px;

  --shadow-sm:0 4px 14px rgba(8,31,48,.06);
  --shadow-md:0 12px 30px rgba(8,31,48,.12);
  --shadow-lg:0 22px 55px rgba(8,31,48,.18);

  --transition:160ms ease;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--fondo);
  color:var(--texto);
  font-size:14px;
  line-height:1.52;
  overflow-x:hidden;
}

button,
input,
select,
textarea{
  font:inherit;
}

   CABECERA
========================================================= */

.tramite-header{

  min-height:76px;
  padding:0 32px;

  align-items:center;
  justify-content:space-between;

  background:var(--grafito);
  color:#fff;
  border-bottom:4px solid var(--guinda);
  box-shadow:0 4px 16px rgba(0,0,0,.18);
  position:sticky;
  top:0;
  z-index:1000;
}

.topbar-brand{
  display:flex;
  align-items:center;

}

.topbar-logo{

========================================================= */

  margin-bottom:20px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:9px;
}

.etapa-workflow-card{
  width:100%;
  min-height:72px;
  padding:11px 12px;
  display:grid;
  grid-template-columns:34px 1fr auto;
  align-items:center;
  gap:10px;
  background:var(--plomo);
  border:1px solid var(--borde);
  border-left:5px solid #87949D;
  border-radius:8px;
  text-align:left;
  box-shadow:none;
}

.etapa-workflow-numero{
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:6px;
  background:var(--azul);
  color:#fff;
  font-size:11px;
  font-weight:850;
}

.etapa-workflow-info{
  display:flex;
  flex-direction:column;
  gap:3px;
}

.etapa-workflow-info strong{
  color:var(--azul);
  font-size:12px;
  line-height:1.25;
  font-weight:850;
}

.etapa-workflow-info span{
  font-size:10px;
  font-weight:800;
}

.etapa-workflow-pct{
  font-size:14px;
  font-weight:900;
}

.etapa-finalizada{
  background:var(--verde-claro) !important;
  border-color:var(--verde-borde) !important;
  border-left-color:var(--verde) !important;
  color:#175D39 !important;
}

.etapa-en-curso,
.etapa-no-iniciada{
  background:var(--plomo) !important;
  border-color:var(--borde) !important;
  border-left-color:#7F8B94 !important;
  color:#5F6D77 !important;
}

/* =========================================================
   PANEL DE SUBETAPAS
========================================================= */

.subetapa-panel{
  padding:20px;
  background:var(--panel);
  border-top:4px solid var(--azul);
}

.subetapa-resumen{
  margin-bottom:14px;
  padding:13px 15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  background:#E8ECEF;
  border-left:5px solid var(--azul);
  border-radius:8px;
}

.subetapa-resumen strong{
  color:var(--azul);
  font-size:16px;
  font-weight:850;
}

.subetapa-resumen span,
.subetapa-resumen p{
  margin-top:3px;
  color:var(--texto-3);
  font-size:11px;
}

.subetapa-porcentaje{
  min-width:66px;
  padding:8px 12px;
  border-radius:7px;
  background:var(--guinda);
  color:#fff !important;
  text-align:center;
  font-size:18px;
  font-weight:900;
}

.etapa-barra-admin,
.etapa-barra{
  height:7px;
  margin-bottom:16px;
  overflow:hidden;
  border-radius:999px;
  background:#D7DDE1;
}

.etapa-barra-admin-fill,
.etapa-barra-fill{
  height:100%;
  background:var(--verde);
}

.lista-subetapas-admin{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.subetapa-admin-card{
  padding:14px;
  background:var(--plomo);
  border:1px solid var(--borde);
  border-left:6px solid #87949D;
  border-radius:9px;
  box-shadow:none;
  opacity:1 !important;
}

.subetapa-admin-card.sub-finalizada,
.subetapa-admin-card.completa{
  background:var(--verde-claro) !important;
  border-color:var(--verde-borde) !important;
  border-left-color:var(--verde) !important;
}

.subetapa-admin-card.sub-en-curso,
.subetapa-admin-card.sub-no-iniciada{
  background:var(--plomo) !important;
  border-color:var(--borde) !important;
  border-left-color:#7F8B94 !important;
}

.subetapa-titulo-row{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}

.subetapa-titulo-row strong,
.subetapa-main > strong{
  color:var(--texto);
  font-size:13px;
  font-weight:850;
}

.subetapa-admin-card.sub-finalizada .subetapa-titulo-row strong,
.subetapa-admin-card.completa .subetapa-titulo-row strong{
  color:#175D39;
}

.subetapa-plazo{
  margin-top:3px;
  color:var(--texto-3);
  font-size:10px;
}

.badge-subetapa{
  padding:4px 7px;
  border-radius:6px;
  font-size:9px;
  font-weight:850;
  white-space:nowrap;
}

.badge-subetapa.sub-finalizada{
  background:var(--verde);
  color:#fff;
}

.badge-subetapa.sub-en-curso,
.badge-subetapa.sub-no-iniciada{
  background:#6E7B84;
  color:#fff;
}

.subetapa-fechas{
  margin-top:11px;
  display:grid;
  grid-template-columns:repeat(3,minmax(160px,1fr));
  gap:8px;
}

.subetapa-fechas > div{
  padding:9px 10px;
  background:#FAFBFB;
  border:1px solid var(--borde-fuerte);
  border-radius:7px;
}

.subetapa-fechas span,
.subetapa-fechas small{
  display:block;
  color:#7C8993;
  font-size:10px;
}

.subetapa-fechas strong{
  display:block;
  margin-top:3px;
  color:var(--texto);
  font-size:11px;
  font-weight:800;
}

/* SIN FRANJA NEGRA */
.acciones-subetapa,
.subetapa-actions,
.acciones-etapa-v4{
  margin-top:12px;
  padding:12px 0 0;
  display:flex;
  flex-wrap:wrap;
  justify-content:flex-end;
  gap:7px;
  background:transparent !important;
  border:none !important;
  border-top:1px solid #D1D7DB !important;
  border-radius:0 !important;
  box-shadow:none !important;
}

.acciones-subetapa:empty,
.subetapa-actions:empty,
.acciones-etapa-v4:empty{
  display:none;
}

.acciones-subetapa button,
.subetapa-actions button{
  width:auto;
  min-height:36px;
  padding:0 12px;
  border-radius:7px;
  font-size:10px;
}

.btn-sub-finalizada{
  background:var(--verde-claro);
  border:1px solid var(--verde-borde);
  color:#175D39;
}

.btn-sub-bloqueada{
  background:#E4E8EB;
  border:1px solid #D0D6DA;
  color:#7B8791;
}

/* =========================================================
   DOCUMENTOS
========================================================= */

.documento-card{
  margin-bottom:10px;
  padding:13px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:#F8F9FA;
  border:1px solid var(--borde);
  border-left:4px solid var(--azul);
  border-radius:8px;
}

.archivo-subetapa,
.archivo-subido-alumno{
  margin-top:9px;
  padding:10px 11px;
  background:#F4F6F7;
  border:1px solid #CBD3D8;
  border-radius:7px;
}

.archivo-subetapa span,
.archivo-subido-alumno span{
  display:block;
  margin-bottom:3px;
  color:#73838F;
  font-size:10px;
}

.archivo-subetapa a,
.archivo-subido-alumno a{
  color:var(--azul);
  font-size:11px;
  font-weight:800;
  text-decoration:none;
}

.drop-pdf{
  padding:32px 20px;
  text-align:center;
  background:#F4F6F7;
  border:2px dashed #AEB8C1;
  border-radius:9px;
  cursor:pointer;
}

.drop-icon{
  margin-bottom:10px;
  font-size:36px;
}

.carga-archivo-invitado{
  margin-top:11px;
  padding:12px;
  background:#F4F6F7;
  border:1px dashed #AEB8C1;
  border-radius:8px;
}

.carga-archivo-info strong{
  color:var(--azul);
  font-size:11px;
}

.carga-archivo-info small{
  color:#7B8792;
  font-size:9px;
}

/* =========================================================
   MENSAJES
========================================================= */

.mensaje-registrado,
.mensaje-alumno-subetapa{
  margin-top:8px;
  padding:9px 10px;
  background:#EEF1F3;
  border:1px solid #D1D8DD;
  border-left:3px solid var(--azul);
  border-radius:7px;
  color:#314B5D;
  font-size:10px;
  line-height:1.4;
}

/* =========================================================
   PANEL COPIAS
========================================================= */

.panel-copias{
  position:fixed;
  top:92px;
  right:20px;
  width:min(340px,calc(100% - 40px));
  padding:18px;
  display:none;
  z-index:99999;
  background:var(--panel);
  border:1px solid var(--borde);
  border-top:4px solid var(--guinda);
  border-radius:11px;
  box-shadow:var(--shadow-lg);
}

.panel-copias h3{
  margin-bottom:14px;
  color:var(--azul);
  font-size:14px;
}

.progress-bar{
  height:8px;
  overflow:hidden;
  background:#DDE2E6;
  border-radius:999px;
}

.progress-fill{
  height:100%;
  width:0%;
  background:var(--verde);
}

.progress-text{
  margin-top:5px;
  color:var(--texto-3);
  font-size:10px;
}

/* =========================================================
   TESIS
========================================================= */

.tesis-card{
  margin:18px 0;
  padding:20px;
  border-left:4px solid var(--guinda);
}

.tesis-icon{
  width:44px;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  background:var(--azul);
  color:#fff;
  font-size:21px;
}

.tesis-header{
  margin-bottom:14px;
  display:flex;
  align-items:center;
  gap:12px;
}

.tesis-header h3{
  color:var(--azul);
  font-size:15px;
}

.tesis-header p{
  color:var(--texto-3);
  font-size:11px;
}

/* =========================================================
   PORTAL INVITADO
========================================================= */

.tramite-body{
  background:var(--fondo);
}

.tramite-container{
  width:min(91%,1420px);
  margin:32px auto;
}

.tramite-resumen{
  margin-bottom:24px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:14px;
}

.resumen-card{
  padding:20px;
  background:var(--panel);
  border-top:4px solid var(--azul);
}

.resumen-card:nth-child(even){
  border-top-color:var(--guinda);
}

.resumen-card small{
  color:var(--texto-3);
  font-size:10px;
  font-weight:850;
  letter-spacing:.7px;
}

.resumen-card h2{
  margin-top:6px;
  color:var(--azul);
  font-size:23px;
  font-weight:900;
}

.barra-container{
  height:9px;
  margin:20px 0 32px;
  overflow:hidden;
  border-radius:999px;
  background:#D7DDE1;
}

.barra-progreso{
  height:100%;
  width:0%;
  background:var(--verde);
}

.timeline-card{
  margin-bottom:12px;
  padding:18px;
  display:flex;
  align-items:flex-start;
  gap:14px;
}

.timeline-icon{
  width:42px;
  height:42px;
  flex:0 0 42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  background:var(--azul);
  color:#fff;
}

.timeline-content h3{
  margin-bottom:7px;
  color:var(--azul);
  font-size:14px;
}

.timeline-content p{
  margin:4px 0;
  color:var(--texto-2);
  font-size:11px;
}

.historial-container{
  margin-top:36px;
}

.historial-container h2{
  margin-bottom:16px;
  color:var(--azul);
  font-size:20px;
  font-weight:850;
}

.historial-card{
  margin-bottom:10px;
  padding:15px;
  display:flex;
  gap:15px;
}

.historial-fecha{
  width:130px;
  flex:0 0 130px;
  color:var(--texto-3);
  font-size:10px;
  font-weight:800;
}

/* =========================================================
   MENÚ USUARIO INVITADO
========================================================= */

.tramite-usuario-menu{
  position:relative;
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 12px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.14);
  border-radius:9px;
  cursor:pointer;
}

.usuario-avatar{
  width:38px;
  height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:7px;
  background:rgba(255,255,255,.10);
}

.usuario-info{
  display:flex;
  flex-direction:column;
}

.usuario-info strong{
  color:#fff;
  font-size:11px;
}

.usuario-info small{
  color:#C5D0D7;
  font-size:9px;
}

.menu-usuario{
  position:absolute;
  top:58px;
  right:0;
  width:240px;
  display:none;
  overflow:hidden;
  background:var(--panel);
  border:1px solid var(--borde);
  border-radius:9px;
  box-shadow:var(--shadow-lg);
  z-index:9999;
}

.menu-usuario.active{
  display:block;
}

.menu-header{
  padding:15px;
  border-bottom:1px solid var(--borde);
}

.menu-header strong{
  display:block;
  color:var(--azul);
  font-size:12px;
}

.menu-header small{
  color:var(--texto-3);
  font-size:10px;
}

.btn-logout{
  width:100%;
  min-height:44px;
  padding:0 15px;
  justify-content:flex-start;
  background:var(--panel);
  color:var(--rojo);
  border-radius:0;
}

/* =========================================================
   ACORDEÓN INVITADO
========================================================= */

.proceso-completo{
  margin-top:30px;
}

.proceso-completo h2{
  margin-bottom:16px;
  color:var(--azul);
  font-size:21px;
  font-weight:850;
}

.etapa-acordeon{
  margin-bottom:12px;
  overflow:hidden;
  background:var(--panel);
  border-left:5px solid var(--azul);
}

.etapa-acordeon-header{
  padding:16px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  cursor:pointer;
  background:#E9EDF0;
}

.etapa-mini{
  display:inline-block;
  margin-bottom:5px;
  padding:4px 7px;
  background:var(--guinda);
  border-radius:5px;
  color:#fff;
  font-size:9px;
  font-weight:850;
  letter-spacing:.7px;
}

.etapa-acordeon-header h3{
  color:var(--azul);
  font-size:14px;
  font-weight:850;
}

.etapa-porcentaje-box{
  width:58px;
  height:48px;
  flex:0 0 58px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:7px;
  background:var(--grafito);
  color:#fff;
  font-size:16px;
  font-weight:900;
}

.etapa-acordeon-body{
  padding:13px 18px 18px;
  background:#E1E5E8;
  border-top:1px solid var(--borde);
}

.subproceso-alumno,
.proceso-alumno-row{
  margin-top:7px;
  padding:11px;
  display:flex;
  align-items:flex-start;
  gap:10px;
  background:var(--plomo);
  border:1px solid var(--borde);
  border-left:5px solid #87949D;
  border-radius:7px;
}

.proceso-alumno-row.finalizado,
.sub-hecho{
  background:var(--verde-claro) !important;
  border-color:var(--verde-borde) !important;
  border-left-color:var(--verde) !important;
}

.proceso-alumno-row.en-curso,
.proceso-alumno-row.no-iniciado,
.sub-pendiente{
  background:var(--plomo) !important;
  border-color:var(--borde) !important;
  border-left-color:#7F8B94 !important;
}

.subproceso-check,
.proceso-alumno-icon{
  width:27px;
  height:27px;
  flex:0 0 27px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:6px;
  background:#D8DDE1;
  color:#6A7884;
  font-size:11px;
  font-weight:900;
}

.sub-hecho .subproceso-check,
.proceso-alumno-row.finalizado .proceso-alumno-icon{
  background:var(--verde);
  color:#fff;
}

.subproceso-texto strong,
.proceso-alumno-info strong{
  display:block;
  margin-bottom:3px;
  color:var(--texto);
  font-size:12px;
  font-weight:800;
}

.subproceso-texto small,
.proceso-alumno-info span,
.proceso-alumno-info small{
  color:var(--texto-3);
  font-size:9px;
}

/* =========================================================
   AVISO FLOTANTE
========================================================= */

.aviso-tramite-alumno{
  position:fixed;
  right:20px;
  bottom:20px;
  width:min(360px,calc(100% - 40px));
  padding:17px;
  background:var(--grafito);
  color:#fff;
  border-left:4px solid var(--guinda);
  border-radius:9px;
  box-shadow:var(--shadow-lg);
  z-index:99999;
}

/* =========================================================
   SCROLL
========================================================= */

::-webkit-scrollbar{
  width:8px;
  height:8px;
}

::-webkit-scrollbar-track{
  background:#D6DBDF;
}

::-webkit-scrollbar-thumb{
  background:#7E8991;
  border-radius:999px;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1050px){
  .admin-layout{
    flex-direction:column;
  }

  .admin-actions{
    width:100%;
    min-width:0;
    position:relative;
    top:auto;
    max-height:none;
  }
}

@media(max-width:800px){
  .topbar,
  .tramite-header{
    padding:16px 18px;
    flex-direction:column;
    align-items:flex-start;
  }

  .topbar-user,
  .user-info,
  .usuario-box{
    width:100%;
  }

  .container,
  .tramite-container{
    width:94%;
  }

  .modal-expediente{
    padding:10px;
  }

  .modal-content{
    padding:18px;
  }

  .grid-admin,
  .subetapa-fechas,
  .workflow-etapas{
    grid-template-columns:1fr;
  }
}

@media(max-width:520px){
  .admin-tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .admin-tab{
    width:100%;
  }

  .acciones-subetapa,
  .subetapa-actions{
    flex-direction:column;
  }

  .acciones-subetapa button,
  .subetapa-actions button{
    width:100%;
  }
}

/* =========================================================
   LOGIN CONSOLIDADO
   Compatible con index.html + login.html definitivos
========================================================= */

.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px 16px;
  background:
    linear-gradient(
      135deg,
      rgba(8,31,48,.97),
      rgba(27,34,40,.97)
    );
}

.login-page .login-container{
  width:min(430px,94%);
  margin:0 auto;
  padding:38px 34px;
  background:var(--panel);
  border:1px solid rgba(255,255,255,.14);
  border-top:5px solid var(--guinda);
  border-radius:var(--radio-lg);
  box-shadow:var(--shadow-lg);
}

.login-brand{
  width:58px;
  height:58px;
  margin:0 auto 16px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  background:var(--azul);
  color:#fff;
  font-size:28px;
  box-shadow:0 8px 22px rgba(8,31,48,.18);
}

.login-page .login-container h2{
  margin-bottom:7px;
  text-align:center;
  color:var(--azul);
  font-size:23px;
  font-weight:900;
  letter-spacing:.01em;
}

.login-subtitle{
  margin-bottom:25px;
  text-align:center;
  color:var(--texto-3);
  font-size:12px;
  font-weight:700;
}

.login-field{
  margin-bottom:15px;
}

.login-field label{
  display:block;
  margin-bottom:6px;
  color:#354854;
  font-size:10px;
  font-weight:850;
  letter-spacing:.35px;
  text-transform:uppercase;
}

.login-page #btnIngresar{
  width:100%;
  min-height:44px;
  margin-top:4px;
  background:var(--guinda);
  border-color:var(--guinda);
  font-size:12px;
}

.login-page #btnIngresar:hover{
  background:var(--guinda-2);
}

.login-page #mensaje{
  min-height:18px;
  margin-top:14px;
  font-size:11px;
  font-weight:800;
}

.login-page #mensaje[data-tipo="ok"]{
  color:var(--verde);
}

.login-page #mensaje[data-tipo="error"]{
  color:var(--rojo);
}

@media (max-width:560px){

  .login-page{
    padding:18px 12px;
  }

  .login-page .login-container{
    padding:30px 22px;
  }

  .login-page .login-container h2{
    font-size:20px;
  }
}



/* =========================================================
   BD-18.7 - PORTAL INVITADO / AGENDA RELACIONAL
   Clases reales generadas por tramite.html
========================================================= */

.etapa-alumno-card{
  margin-bottom:18px;
  overflow:hidden;
  background:var(--panel);
  border:1px solid var(--borde);
  border-left:6px solid #AAB4BB;
  border-radius:14px;
  box-shadow:0 5px 16px rgba(20,38,52,.08);
  transition:transform .2s ease, box-shadow .2s ease;
}

.etapa-alumno-card:hover{
  transform:translateY(-1px);
  box-shadow:0 8px 22px rgba(20,38,52,.11);
}

.etapa-alumno-card.alumno-en-curso{
  border-left-color:#C79524;
}

.etapa-alumno-card.alumno-finalizado{
  border-left-color:var(--verde);
}

.etapa-alumno-card.alumno-no-iniciado{
  border-left-color:#AAB4BB;
}

.etapa-alumno-header{
  padding:18px 20px;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:18px;
  cursor:pointer;
  background:#F8FAFB;
  border-bottom:1px solid #E2E7EA;
}

.etapa-alumno-card.alumno-en-curso .etapa-alumno-header{
  background:#FFF9EC;
}

.etapa-alumno-card.alumno-finalizado .etapa-alumno-header{
  background:#F2F9F4;
}

.etapa-alumno-header > div:first-child{
  min-width:0;
}

.etapa-alumno-header > div:first-child > span{
  display:inline-block;
  margin-bottom:6px;
  padding:4px 8px;
  color:#fff;
  background:var(--azul);
  border-radius:999px;
  font-size:10px;
  font-weight:900;
  letter-spacing:.7px;
}

.etapa-alumno-card.alumno-en-curso .etapa-alumno-header > div:first-child > span{
  background:#A87310;
}

.etapa-alumno-card.alumno-finalizado .etapa-alumno-header > div:first-child > span{
  background:var(--verde);
}

.etapa-alumno-header h3{
  margin:0 0 6px;
  color:var(--azul);
  font-size:17px;
  line-height:1.3;
  font-weight:900;
}

.etapa-alumno-header small{
  display:inline-block;
  color:var(--texto-2);
  font-size:11px;
  font-weight:850;
}

.etapa-fechas{
  margin-top:9px;
  display:flex;
  flex-wrap:wrap;
  gap:8px 18px;
  color:var(--texto-3);
  font-size:10px;
}

.etapa-fechas span{
  display:inline-flex;
  align-items:center;
  gap:4px;
}

.etapa-fechas b{
  color:var(--texto);
}

.etapa-alumno-pct{
  width:62px;
  height:62px;
  flex:0 0 62px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#E9EEF1;
  color:var(--azul);
  font-size:16px;
  font-weight:950;
  border:4px solid #D7E0E5;
}

.alumno-en-curso .etapa-alumno-pct{
  background:#FFF3D4;
  border-color:#E9D59A;
  color:#885E08;
}

.alumno-finalizado .etapa-alumno-pct{
  background:#E7F5EB;
  border-color:#BFE0C8;
  color:var(--verde);
}

.etapa-alumno-barra{
  height:6px;
  background:#E7ECEF;
}

.etapa-alumno-barra > div{
  height:100%;
  background:var(--guinda);
  transition:width .35s ease;
}

.alumno-en-curso .etapa-alumno-barra > div{
  background:#C79524;
}

.alumno-finalizado .etapa-alumno-barra > div{
  background:var(--verde);
}

.etapa-alumno-body{
  padding:12px 16px 18px;
  background:#FFFFFF;
}

.proceso-alumno-row{
  margin-top:9px;
  padding:13px 14px;
  display:grid;
  grid-template-columns:38px minmax(0,1fr);
  gap:12px;
  align-items:flex-start;
  background:#F7F9FA;
  border:1px solid #DDE4E8;
  border-left:5px solid #A6B0B7;
  border-radius:10px;
}

.proceso-alumno-row.proceso-finalizado{
  background:#F1F8F3;
  border-color:#CFE4D5;
  border-left-color:var(--verde);
}

.proceso-alumno-row.proceso-en-curso{
  background:#FFF9EC;
  border-color:#E9D8A9;
  border-left-color:#C79524;
}

.proceso-alumno-row.proceso-no-iniciado{
  background:#F7F9FA;
  border-color:#DDE4E8;
  border-left-color:#A6B0B7;
}

.proceso-alumno-icon{
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  background:#E1E7EA;
  color:#66757F;
  font-size:14px;
  font-weight:950;
}

.proceso-finalizado .proceso-alumno-icon{
  background:var(--verde);
  color:#fff;
}

.proceso-en-curso .proceso-alumno-icon{
  background:#C79524;
  color:#fff;
}

.proceso-alumno-info{
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:5px;
}

.proceso-alumno-info strong{
  margin:0;
  color:var(--texto);
  font-size:13px;
  line-height:1.38;
  font-weight:850;
}

.proceso-alumno-info span,
.proceso-alumno-info small{
  display:block;
  color:var(--texto-3);
  font-size:10px;
  line-height:1.45;
}

.proceso-alumno-info span b{
  color:var(--texto);
}

.proceso-finalizado .proceso-alumno-info span b{
  color:var(--verde);
}

.proceso-en-curso .proceso-alumno-info span b{
  color:#94670D;
}

.tramite-resumen .resumen-card{
  min-height:105px;

  box-shadow:0 4px 14px rgba(20,38,52,.07);
}

.tramite-resumen .resumen-card h2{
  line-height:1.25;

   V23 · IDENTIDAD INSTITUCIONAL UNSA

========================================================= */

  --unsa-fondo:#F4F6F8;--unsa-superficie:#FFFFFF;--unsa-borde:#D8E0E6;
  --unsa-texto:#172B3A;--unsa-muted:#647786;--unsa-radio:10px;
  --unsa-sombra:0 12px 32px rgba(16,45,63,.12)
}
html,body{font-family:"Segoe UI",Roboto,Arial,sans-serif!important;color:var(--unsa-texto)!important}

input,select,textarea{
  min-height:40px!important;padding:9px 12px!important;border:1px solid #BCC9D2!important;
  border-radius:8px!important;background:#fff!important;color:var(--unsa-texto)!important;

input:focus,select:focus,textarea:focus{outline:0!important;border-color:var(--unsa-guinda)!important;box-shadow:0 0 0 3px rgba(122,16,38,.10)!important}
input::placeholder,textarea::placeholder{color:#94A3AD!important;font-weight:400!important}
button,.btn,.btn-registrar{border-radius:8px!important;font-family:"Segoe UI",Roboto,Arial,sans-serif!important;font-weight:700!important;transition:transform .12s,box-shadow .12s,background .12s!important}
button:not(:disabled):hover,.btn:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(16,45,63,.14)}

.modal-expediente,.modal-asesores-v21,.modal-accion-workflow{background:rgba(11,29,41,.66)!important;backdrop-filter:blur(4px)}
