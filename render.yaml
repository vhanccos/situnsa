services:
  - type: web
    name: situnsa-web
    runtime: docker
    dockerfilePath: deploy/Dockerfile.render
    dockerContext: .
    region: oregon
    plan: free
    branch: main
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: situnsa-db
          property: connectionString
      - key: DOCS_VOLUME_PATH
        value: /var/data/titulacion-docs
      # Auth real (port A2): HS256 >= 32 caracteres, generado por Render
      - key: JWT_SECRET
        generateValue: true
      # Clave del seed demo (SOLO demo; nunca usar en prod serio)
      - key: DEMO_PASSWORD
        value: x
      # Stub x-user-dni desactivado: se exige Bearer JWT
      - key: AUTH_STUB
        value: "0"
      - key: NODE_ENV
        value: production
      # Enlaces de los correos (activación, Mi Trámite): sin APP_URL la API
      # usa RENDER_EXTERNAL_URL, la URL pública que Render inyecta. Definir
      # APP_URL solo con un dominio propio.
      # Correo real: SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS y SMTP_SECURE
      # se cargan como secretos en el Dashboard (no se versionan). Sin
      # SMTP_HOST los correos solo se registran en el log del servicio.
      - key: MAIL_FROM
        value: no-reply@fips.unsa.edu.pe

databases:
  - name: situnsa-db
    databaseName: pis_titulacion
    user: pis
    region: oregon
    plan: free
