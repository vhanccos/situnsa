services:
  - type: web
    name: situnsa-web
    runtime: docker
    dockerfilePath: deploy/Dockerfile.render
    dockerContext: .
    region: oregon
    plan: free
    branch: main
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: situnsa-db
          property: connectionString
      - key: DOCS_VOLUME_PATH
        value: /var/data/titulacion-docs
      - key: BETTER_AUTH_SECRET
        generateValue: true

databases:
  - name: situnsa-db
    databaseName: pis_titulacion
    user: pis
    region: oregon
    plan: free
