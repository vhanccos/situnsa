services:
  - type: web
    name: situnsa-web
    runtime: docker
    dockerfilePath: deploy/Dockerfile.render
    dockerContext: .
    region: oregon
    plan: free
    branch: main
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: situnsa-db
          property: connectionString
      - key: DOCS_VOLUME_PATH
        value: /var/data/titulacion-docs
      # Auth real (port A2): HS256 >= 32 caracteres, generado por Render
      - key: JWT_SECRET
        generateValue: true
      # Clave del seed demo (SOLO demo; nunca usar en prod serio)
      - key: DEMO_PASSWORD
        value: x
      # Stub x-user-dni desactivado: se exige Bearer JWT
      - key: AUTH_STUB
        value: "0"
      - key: NODE_ENV
        value: production

databases:
  - name: situnsa-db
    databaseName: pis_titulacion
    user: pis
    region: oregon
    plan: free
